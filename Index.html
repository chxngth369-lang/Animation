<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAST DAY: กรุงเทพฯ วันสิ้นโลก – EP.1</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0f;color:#eee;font-family:Kanit,sans-serif;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding:16px;min-height:100vh}
#stage{height:calc(100vh - 32px);aspect-ratio:9/16;background:#000;border-radius:12px;box-shadow:0 0 40px rgba(255,0,0,.15);cursor:pointer}
@media(max-width:800px){#stage{width:100%;height:auto}}
.panel{width:340px;max-width:100%;background:#16161d;border:1px solid #2a2a35;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h1{font-size:20px;color:#ff4d4d}
button{background:#c62828;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 15px Kanit,sans-serif;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:#333}
input[type=file]{width:100%;padding:12px;background:#222;border:2px dashed #c62828;border-radius:8px;color:#fff;font:14px Kanit,sans-serif;cursor:pointer}
#drop{border:2px dashed #555;border-radius:8px;padding:12px;text-align:center;color:#999;font-size:13px}
input[type=range]{width:100%}
.row{display:flex;align-items:center;gap:8px;font-size:13px}.row span{white-space:nowrap;width:120px}
#status{font-size:13px;color:#bbb;line-height:1.5;white-space:pre-line;min-height:40px}
small{color:#888;line-height:1.5}
hr{border:0;border-top:1px solid #2a2a35}
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div class="panel">
  <h1>LAST DAY – EP.1</h1>
  <b>① เลือกไฟล์เสียงพากย์</b>
  <input type="file" id="file" accept=".wav,.mp3,.m4a,.aac,.ogg,audio/*">
  <div id="drop">หรือลากไฟล์เสียงมาวางที่นี่</div>
  <button id="play" disabled>▶ เล่นตัวอย่าง</button>
  <input type="range" id="seek" min="0" max="1" step="0.001" value="0">
  <div class="row"><span>🎙 เสียงพากย์</span><input type="range" id="vVol" min="0" max="2" step="0.05" value="1"></div>
  <div class="row"><span>💥 ซาวด์เอฟเฟกต์</span><input type="range" id="sVol" min="0" max="2" step="0.05" value="1"></div>
  <button id="rec" disabled>⏺ อัดและดาวน์โหลด MP4</button>
  <div id="status">ยังไม่ได้เลือกไฟล์เสียง</div>
  <hr>
  <b>ปรับซิงก์ซับ</b>
  <button id="syncBtn" class="sec" disabled>🎯 โหมดซิงก์ด้วยมือ</button>
  <button id="resetSync" class="sec">↺ กลับเป็นซิงก์อัตโนมัติ</button>
  <small>โหมดซิงก์: เสียงจะเล่นตั้งแต่ต้น กด <b>Spacebar</b> (หรือแตะที่ภาพ) ทุกครั้งที่ประโยคใหม่เริ่มพูด</small>
</div>
<audio id="audio" preload="auto"></audio>

<script>
const cv=document.getElementById('stage'),MAIN=cv.getContext('2d');let ctx=MAIN;
const W=1080,H=1920,GY=1250,$=id=>document.getElementById(id),audio=$('audio');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,ease=k=>k*k*(3-2*k);
const hs=(a,b)=>{const s=Math.sin(a*12.9898+b*78.233)*43758.5453;return s-Math.floor(s)};
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const F=(w,s)=>ctx.font=`${w} ${s}px Kanit,"Noto Sans Thai",Tahoma,sans-serif`;

/* ================= บท / ซับ ================= */
const SEG=[
['title','','LAST DAY: กรุงเทพฯ วันสิ้นโลก'],
['title','','EP.1 – วันสุดท้ายของกรุงเทพฯ'],
['city','','วันที่ 15 พฤศจิกายน เวลา 16:30 น.'],
['city','','กรุงเทพฯ ยังคงเต็มไปด้วยผู้คน'],
['city','','ทุกคนใช้ชีวิตตามปกติ โดยไม่มีใครรู้ว่ากำลังจะเกิดอะไรขึ้น'],
['traffic','นนท์','วันนี้รถติดชะมัด เมื่อไหร่จะถึงบ้านเนี่ย'],
['phone','','เสียงโทรศัพท์ดังขึ้น'],
['phone','แม่','นนท์ ลูกอยู่ไหนแล้ว?'],
['phone','นนท์','กำลังกลับครับแม่ อีกไม่นานก็ถึงแล้ว'],
['tv','','ทันใดนั้น โทรทัศน์ตามร้านค้าเปลี่ยนเป็นประกาศฉุกเฉิน'],
['tv','ผู้ประกาศข่าว','ประกาศฉุกเฉิน! ตรวจพบการโจมตีด้วยอาวุธนิวเคลียร์'],
['tv','ผู้ประกาศข่าว','ขอให้ประชาชนทุกคนหาที่หลบภัยทันที!'],
['shock','นนท์','อะไรนะ! นิวเคลียร์งั้นเหรอ?!'],
['phone2','แม่','นนท์! รีบหาที่หลบภัยเดี๋ยวนี้เลย!'],
['siren','','เสียงไซเรนดังไปทั่วเมือง ผู้คนต่างวิ่งหนีด้วยความแตกตื่น'],
['explosion','','ก่อนจะมีเสียงระเบิดดังสนั่นจากระยะไกล'],
['explosion','นนท์','ไม่นะ! ต้องรีบหาที่หลบภัยแล้ว!'],
['blackout','','เขารีบเข้าไปหลบในอาคารใกล้ ๆ ก่อนที่ทุกอย่างจะมืดลง'],
['basement','','หลายชั่วโมงต่อมา นนท์ค่อย ๆ ลืมตาขึ้นในห้องใต้ดินที่เต็มไปด้วยฝุ่น'],
['basement','นนท์','ที่นี่ที่ไหน… เกิดอะไรขึ้น?'],
['nosignal','','เขาหยิบโทรศัพท์ขึ้นมา แต่กลับไม่มีสัญญาณ'],
['nosignal','นนท์','แม่… พ่อ… ทำไมติดต่อไม่ได้เลย?'],
['ruins','','นนท์เดินไปเปิดประตูห้องใต้ดิน'],
['ruins','','สิ่งที่เห็นตรงหน้าคือกรุงเทพฯ ที่พังทลาย ถนนเต็มไปด้วยซากรถและอาคารที่เสียหาย'],
['ruins','นนท์','นี่มันกรุงเทพฯ จริง ๆ เหรอ…'],
['growl','','ทันใดนั้น เสียงคำรามดังมาจากหลังรถที่อยู่ไม่ไกล'],
['growl','นนท์','เดี๋ยวนะ… นั่นเสียงอะไร?'],
['monster','','เงาปริศนาค่อย ๆ เดินออกมาจากความมืดและมุ่งหน้ามาหาเขา'],
['monster','นนท์','ไม่นะ… นั่นมันตัวอะไรกัน?!'],
['end','','จบ EP.1 – TO BE CONTINUED']
];
const SPK={'นนท์':'#4fc3f7','แม่':'#f48fb1','ผู้ประกาศข่าว':'#ffb300'};

/* ================= เวลา ================= */
let dur=150,times=[],EVENTS=[],syncing=false,syncTimes=[],recording=false;
function autoTimes(d){const w=SEG.map(s=>s[2].length+8),tot=w.reduce((a,b)=>a+b);let acc=0;return w.map(x=>{const s=acc/tot*d;acc+=x;return s})}
function setTimes(a){times=a;EVENTS=buildEvents()}
function segAt(t){let i=0;for(let k=0;k<times.length;k++)if(t>=times[k])i=k;return i}
function nextTime(i){if(i+1>=SEG.length)return Math.max(dur,times[i]+1);return isFinite(times[i+1])?times[i+1]:times[i]+4}
function range(i){const sc=SEG[i][0];let a=i,b=i;while(a>0&&SEG[a-1][0]===sc)a--;while(b<SEG.length-1&&SEG[b+1][0]===sc&&isFinite(times[b+1]))b++;const s0=times[a];let s1=nextTime(b);if(s1<=s0)s1=s0+1;return{s0,s1}}

/* ================= ข้อมูลฉาก ================= */
function mkLayer(minH,maxH,minW,maxW){const L=[];let x=-30;while(x<W+30){const w=minW+R()*(maxW-minW);L.push({x,w,h:minH+R()*(maxH-minH),s:R(),ant:R()<.3});x+=w+R()*14}return L}
const BACK=mkLayer(400,850,80,160),FRONT=mkLayer(250,700,110,200);
const CARS=[...Array(10)].map((_,i)=>({x:R()*1400-160,lane:i%2,col:`hsl(${(R()*360)|0},55%,${(35+R()*25)|0}%)`,s:R()}));
const PPL=[...Array(26)].map(()=>({x:R()*W,d:R()<.5?-1:1,s:.7+R()*.4,ph:R()*6,v:R()}));
const EMB=[...Array(70)].map(()=>({x:R()*W,y:R(),v:.3+R(),p:R()*6,r:2+R()*3}));

/* ================= ตัวช่วยวาด ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function zoomC(s,cx,cy){ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy)}
function sky(a,b,c){const g=ctx.createLinearGradient(0,0,0,GY+100);g.addColorStop(0,a);g.addColorStop(.6,b);g.addColorStop(1,c||b);ctx.fillStyle=g;ctx.fillRect(-60,-60,W+120,H+120)}
function glow(x,y,r,c0){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function jag(x,h,w,s){const top=GY-h;ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,top+hs(s,1)*80);for(let k=1;k<=6;k++)ctx.lineTo(x+w*k/6,top+hs(s,k+2)*h*.4);ctx.lineTo(x+w,GY);ctx.closePath();ctx.fill()}
function windows(b,h){for(let y=GY-h+24;y<GY-30;y+=38)for(let x=b.x+14;x<b.x+b.w-22;x+=30){const r=hs(x,y);if(r>.5){ctx.fillStyle=r>.85?'rgba(255,240,200,.9)':'rgba(255,200,110,.75)';ctx.fillRect(x,y,14,20)}}}
function drawCity(o={}){const ruin=o.ruin;
  for(const b of BACK){const h=ruin?b.h*(.45+.4*b.s):b.h;ctx.fillStyle=o.back||'#3b2a4d';ruin?jag(b.x,h,b.w,b.s):ctx.fillRect(b.x,GY-h,b.w,h)}
  for(const b of FRONT){const h=ruin?b.h*(.3+.45*b.s):b.h;ctx.fillStyle=o.front||'#1a1424';
    if(ruin)jag(b.x,h,b.w,b.s+1);else{ctx.fillRect(b.x,GY-h,b.w,h);if(b.ant)ctx.fillRect(b.x+b.w/2-3,GY-h-60,6,60)}
    if(o.lit&&!ruin)windows(b,h)}}
function ground(ruin){ctx.fillStyle=ruin?'#24201c':'#2b2b30';ctx.fillRect(-60,GY,W+120,90);ctx.fillStyle=ruin?'#171513':'#1d1d21';ctx.fillRect(-60,GY+90,W+120,H);ctx.fillStyle=ruin?'rgba(120,110,100,.3)':'rgba(240,240,240,.7)';for(let x=-40;x<W;x+=140)ctx.fillRect(x,GY+330,80,10)}
function car(x,y,s,col,brake,burnt,tilt){ctx.save();ctx.translate(x,y);ctx.rotate(tilt||0);ctx.scale(s,s);
  ctx.fillStyle=burnt?'#2b2622':col;rr(-90,-40,180,50,12);ctx.fill();rr(-55,-75,110,40,14);ctx.fill();
  ctx.fillStyle=burnt?'#0c0b0a':'#9cc8e8';rr(-45,-68,90,26,8);ctx.fill();
  ctx.fillStyle='#111';for(const wx of[-55,55]){ctx.beginPath();ctx.arc(wx,12,16,0,7);ctx.fill()}
  if(brake){ctx.fillStyle='#ff2020';ctx.shadowColor='#f00';ctx.shadowBlur=30;ctx.fillRect(-90,-30,14,12);ctx.fillRect(76,-30,14,12);ctx.shadowBlur=0}
  ctx.restore()}
function cars(t,speed,brake,ruin){for(const c of CARS){const y=GY+(c.lane?470:240),s=c.lane?1.3:.95;let x=c.x;
  if(speed)x=((c.x+t*speed*(c.lane?1:-1)*(.7+c.s*.5))%1400+1400)%1400-160;
  car(x,y,s,c.col,brake&&Math.sin(t*3+c.s*9)>-.3,ruin,ruin?(c.s-.5)*.5:0)}}
function person(x,y,s,ph,run,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=11;ctx.lineCap='round';
  const a=Math.sin(ph)*(run?.9:.4),lean=run?14:0;
  ctx.beginPath();ctx.arc(lean,-152,19,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(lean,-130);ctx.lineTo(0,-72);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-72);ctx.lineTo(Math.sin(a)*42,0);ctx.moveTo(0,-72);ctx.lineTo(-Math.sin(a)*42,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lean*.8,-120);ctx.lineTo(-Math.sin(a)*38,-78);ctx.moveTo(lean*.8,-120);ctx.lineTo(Math.sin(a)*38,-78);ctx.stroke();ctx.restore()}
function crowd(t,run,col){for(const p of PPL){const sp=run?260+p.v*160:40+p.v*30;const x=((p.x+p.d*sp*t)%(W+100)+W+100)%(W+100)-50,y=GY+60+p.v*25;
  ctx.save();if(p.d<0){ctx.translate(x,0);ctx.scale(-1,1);ctx.translate(-x,0)}person(x,y,p.s*.75,t*(run?14:6)+p.ph,run,col||'#0d0a12');ctx.restore()}}
function embers(t,col='255,140,40'){for(const e of EMB){const y=H-((t*e.v*90+e.y*H)%H),x=e.x+Math.sin(t*1.3+e.p)*40;ctx.fillStyle=`rgba(${col},${.4+.4*Math.sin(t*5+e.p)})`;ctx.fillRect(x,y,e.r,e.r)}}
function dust(t){for(const e of EMB){const y=(t*e.v*25+e.y*H)%H,x=e.x+Math.sin(t*.7+e.p)*30;ctx.fillStyle=`rgba(220,210,190,${.15+.15*Math.sin(t*2+e.p)})`;ctx.beginPath();ctx.arc(x,y,e.r*.8,0,7);ctx.fill()}}
function hud(txt,k){F(600,46);const ch=[...txt],s=ch.slice(0,Math.floor(clamp(k)*ch.length)).join('');ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.55)';rr(60,140,ctx.measureText(txt).width+120,90,18);ctx.fill();
  ctx.fillStyle='#ff4040';ctx.beginPath();ctx.arc(105,185,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(s+(Math.floor(performance.now()/400)%2?'▌':''),135,187)}
function cityBase(t,o={}){sky('#23305e','#e9776a','#ffc27a');glow(760,GY-180,520,'rgba(255,190,120,.7)');ctx.fillStyle='#ffd59a';ctx.beginPath();ctx.arc(760,GY-180,90,0,7);ctx.fill();
  drawCity({lit:true,back:'#5a3a5e',front:'#2a1f35'});ground();cars(t,o.speed??90,o.brake);crowd(t,false)}
function ruinBase(t){sky('#2b2422','#7a4a30','#b8743e');glow(W*.3,GY-300,600,'rgba(255,170,100,.35)');
  drawCity({ruin:true,back:'#3a302a',front:'#1c1714'});
  for(let k=0;k<4;k++){const x=150+k*260;for(let j=0;j<9;j++){const q=(t*40+j*85)%760,y=GY-250-q,r=40+q/8;ctx.fillStyle=`rgba(35,30,28,${.35*(1-q/760)})`;ctx.beginPath();ctx.arc(x+Math.sin(t+j)*30,y,r,0,7);ctx.fill()}
    glow(x,GY-40,130+Math.sin(t*12+k)*18,'rgba(255,120,30,.65)')}
  ground(true);cars(0,0,false,true);embers(t);ctx.fillStyle='rgba(180,120,80,.12)';ctx.fillRect(-60,-60,W+120,H+120)}
function mushroom(x,y,k,t){if(k<=0)return;const sh=650*k,cr=110+230*k;
  const g=ctx.createLinearGradient(x,y-sh,x,y);g.addColorStop(0,'#ffcf7a');g.addColorStop(1,'#ff6a1a');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x-90*k-30,y);ctx.quadraticCurveTo(x-30,y-sh*.5,x-45*k-20,y-sh);ctx.lineTo(x+45*k+20,y-sh);ctx.quadraticCurveTo(x+30,y-sh*.5,x+90*k+30,y);ctx.fill();
  for(let j=0;j<14;j++){const a=j/14*Math.PI*2,rx=x+Math.cos(a)*cr*.7,ry=y-sh+Math.sin(a)*cr*.35,r=cr*(.45+.15*Math.sin(t*2+j));
    const gg=ctx.createRadialGradient(rx,ry-r*.3,0,rx,ry,r);gg.addColorStop(0,'#fff1c0');gg.addColorStop(.5,'#ff8c2a');gg.addColorStop(1,'rgba(120,30,10,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(rx,ry,r,0,7);ctx.fill()}
  glow(x,y-sh,cr*1.3,'rgba(255,255,220,.8)');ctx.strokeStyle='rgba(255,200,150,.5)';ctx.lineWidth=20*k;ctx.beginPath();ctx.ellipse(x,y-sh*.55,cr*.6,cr*.12,0,0,7);ctx.stroke()}
function creature(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#030203';ctx.strokeStyle='#030203';const sw=Math.sin(t*3)*15;
  ctx.beginPath();ctx.moveTo(-80,0);ctx.lineTo(-45+sw,-390);ctx.lineTo(45-sw,-390);ctx.lineTo(80,0);ctx.lineTo(35,0);ctx.lineTo(0,-300);ctx.lineTo(-35,0);ctx.fill();
  ctx.beginPath();ctx.moveTo(-110,-380);ctx.quadraticCurveTo(-170,-650,-40,-780);ctx.quadraticCurveTo(80,-820,125,-640);ctx.quadraticCurveTo(145,-500,110,-380);ctx.fill();
  ctx.beginPath();ctx.ellipse(10,-820,72,88,.2,0,7);ctx.fill();
  for(let k=0;k<6;k++){ctx.beginPath();ctx.moveTo(-60+k*25,-720+k*10);ctx.lineTo(-115+k*20,-830+k*12);ctx.lineTo(-40+k*25,-740+k*12);ctx.fill()}
  ctx.lineCap='round';for(const d of[-1,1]){ctx.lineWidth=38;ctx.beginPath();ctx.moveTo(d*90,-650);ctx.quadraticCurveTo(d*230,-420+sw*d,d*175,-150);ctx.stroke();
    ctx.lineWidth=10;for(let c=-1;c<=1;c++){ctx.beginPath();ctx.moveTo(d*175,-150);ctx.lineTo(d*(175+c*30),-60);ctx.stroke()}}
  const bl=Math.sin(t*1.7)>.97?.2:1,lk=Math.sin(t*.9)*6;ctx.shadowColor='#ff0000';ctx.shadowBlur=45;ctx.fillStyle='#ff2a1a';
  for(const ex of[-18,40]){ctx.beginPath();ctx.ellipse(ex+lk,-832,17,7*bl,.2,0,7);ctx.fill()}ctx.shadowBlur=0;ctx.restore()}

/* ================= ตัวละคร (ตาขยับ / ปากขยับ) ================= */
const CH={
 non:{skin:'#e3ad83',sd:'#b57a52',hair:'#15100d',shirt:'#2d4a73',col:'#4d77ad',style:'non',iris:'#4a2c18'},
 mom:{skin:'#ecbd98',sd:'#c48a63',hair:'#2b1a12',shirt:'#8e3352',col:'#f0d6dc',style:'mom',iris:'#3e2414'},
 anchor:{skin:'#d8a079',sd:'#a8704a',hair:'#0e0b09',shirt:'#1c2433',col:'#f2f2f2',style:'anchor',iris:'#2e1c10'}
};
const EXPR={
 neutral:{open:.85,bi:0,bo:0,pup:7,cv:6,mo:0},
 smile:{open:.72,bi:-4,bo:-2,pup:7,cv:16,mo:0},
 bored:{open:.55,bi:6,bo:3,pup:7,cv:-3,mo:0},
 worried:{open:.95,bi:-16,bo:6,pup:6,cv:-10,mo:0},
 shock:{open:1.25,bi:-26,bo:-20,pup:3.5,cv:0,mo:.45},
 fear:{open:1.15,bi:-20,bo:6,pup:4,cv:-12,mo:.18,sweat:1},

 debris(){const t=actx.currentTime;for(let k=0;k<26;k++){const tt=t+Math.random()*2.5,g=O();chain(nsrc(BB,tt,.2),filt('bandpass',300+Math.random()*1500,2),g);envG(g,tt,.003,.3+Math.random()*.4,.12)}},

  const g2=O();chain(nsrc(NB,t,.3),filt('lowpass',900),g2);envG(g2,t,.002,.5,.2)},
 drip(){const t=actx.currentTime;[[0,.15],[.25,.04]].forEach(([d,v])=>{const g=O(),o=tone('sine',1500,t+d,.2);o.frequency.setValueAtTime(1500,t+d);o.frequency.exponentialRampToValueAtTime(500,t+d+.08);o.connect(g);envG(g,t+d,.002,v,.12)})},
 sit(){const t=actx.currentTime;[913.8,1370.6,1776.7].forEach((f,k)=>{const s=t+k*.33,g=O();tone('sine',f,s,.3).connect(g);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.01);g.gain.setValueAtTime(.12,s+.27);g.gain.linearRampToValueAtTime(0,s+.29)})},
 creak(){const t=actx.currentTime,g=O(),o=tone('sawtooth',110,t,1.8);for(let k=0;k<30;k++)o.frequency.setValueAtTime(80+Math.random()*90,t+k*.055);chain(o,filt('bandpass',900,5),g);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.2);g.gain.setValueAtTime(.35,t+1.4);g.gain.linearRampToValueAtTime(0,t+1.7)},
 crackle(){const t=actx.currentTime;for(let k=0;k<5;k++){const tt=t+Math.random()*.35,g=O();chain(nsrc(NB,tt,.04),filt('bandpass',2500+Math.random()*2000,1),g);envG(g,tt,.001,.08+Math.random()*.12,.025)}},
 growl(big){const t=actx.currentTime,d=big?3:2.2,pk=big?.5:.32,g=O(),am=actx.createGain();am.gain.value=.5;
  [52,55.5,104].forEach(f=>{const o=tone('sawtooth',f*1.2,t,d+.2);o.frequency.exponentialRampToValueAtTime(f*.8,t+d);o.connect(am)});
  const lg=actx.createGain();lg.gain.value=.5;tone('sine',17,t,d+.2).connect(lg);lg.connect(am.gain);
  chain(am,shaper(6),filt('lowpass',big?900:650),g);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+.35);g.gain.setValueAtTime(pk,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  const g2=O();chain(nsrc(NB,t,d),filt('bandpass',350,1.2),g2);envG(g2,t,.3,big?.35:.2,d-.3)},
 heart(){const t=actx.currentTime;[[0,.7],[.24,.45]].forEach(([d,v])=>{const g=O(),o=tone('sine',70,t+d,.3);o.frequency.setValueAtTime(70,t+d);o.frequency.exponentialRampToValueAtTime(40,t+d+.15);o.connect(g);envG(g,t+d,.008,v,.18)})},
 step(){const t=actx.currentTime,g=O(),o=tone('sine',55,t,.6);o.frequency.exponentialRampToValueAtTime(28,t+.45);o.connect(g);envG(g,t,.004,.9,.5);
  const g2=O();chain(nsrc(BB,t,.3),filt('lowpass',400),g2);envG(g2,t,.003,.6,.25);if(Math.random()<.6)setTimeout(()=>sfx.crackle(),120)},
 riser(d){const t=actx.currentTime;d=Math.max(1.5,Math.min(d||3,6));const lp=filt('lowpass',400,3),g=O();lp.connect(g);
  [466,494,523,554,233,247].forEach(f=>{const o=tone('sawtooth',f*.5,t,d+.1);o.frequency.exponentialRampToValueAtTime(f*1.4,t+d);o.connect(lp)});
  lp.frequency.exponentialRampToValueAtTime(6000,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+d*.95);g.gain.linearRampToValueAtTime(0,t+d+.05)},
 blip(){const t=actx.currentTime,g=O();tone('square',1200,t,.12).connect(g);envG(g,t,.003,.06,.08)}
};
function buildEvents(){const E=[],len=i=>nextTime(i)-times[i],at=(i,o,n,a)=>{const tt=times[i]+o;if(isFinite(tt))E.push({t:tt,n,a})};
  at(0,.02,'hit');at(0,.05,'glitch');at(1,0,'whoosh');at(2,0,'whoosh');at(2,.3,'blip');
  at(5,.4,'horn',1);at(5,1.5,'horn',.7);at(7,0,'click');
  at(9,0,'static');at(10,0,'hit');at(12,0,'hit');at(12,0,'glitch');at(13,0,'whoosh');at(14,0,'horn',1);
  at(15,0,'boom');at(15,.6,'debris');at(16,0,'debris');
  if(isFinite(times[17]))at(17,len(17)*.55,'slam');
  at(20,0,'click');at(22,0,'creak');at(23,0,'whoosh');
  at(25,.3,'growl');at(26,0,'heart');at(27,0,'growl',1);
  if(isFinite(times[28]))at(28,0,'riser',len(28));
  at(29,0,'hit');at(29,.05,'glitch');
  return E.sort((a,b)=>a.t-b.t)}
const PER=[
 {segs:[6],per:2.2,n:'ring'},
 {segs:[2,3,4],per:3.1,n:'horn',a:.35,prob:.5},
 {segs:[14],per:.8,n:'horn',a:.6,prob:.45},
 {segs:[18,19],per:2.6,n:'drip'},
 {segs:[20,21],per:2.4,n:'sit'},
 {segs:[22,23,24,25],per:.45,n:'crackle',prob:.6},
 {segs:[26,27,28],per:.75,n:'heart'},
 {segs:[27],per:1.15,n:'step'}];
let lastT=0,perLast={};
function fire(n,a){try{sfx[n](a)}catch(err){console.warn(err)}}
function sfxTick(t){if(!actx)return;const playing=!audio.paused&&!audio.ended;
  if(playing&&t>=lastT&&t-lastT<.6){
    for(const ev of EVENTS)if(ev.t>lastT&&ev.t<=t)fire(ev.n,ev.a);
    const i=segAt(t);PER.forEach((pd,n)=>{if(!pd.segs.includes(i)||!isFinite(times[i]))return;const k=Math.floor((t-times[i])/pd.per),key=n+'_'+i;
      if(perLast[key]!==k){perLast[key]=k;if(!pd.prob||Math.random()<pd.prob)fire(pd.n,pd.a)}})}
  else if(!playing)perLast={};
  lastT=t;
  const i=segAt(t),sc=SEG[i][0],r=range(i),p=clamp((t-r.s0)/(r.s1-r.s0)),sp=clamp((t-times[i])/(nextTime(i)-times[i])),T=ambTargets(sc,i,p,sp),now=actx.currentTime;
  for(const k in AMB){const v=playing?(T[k]||0)*AMBK[k]:0;if(Math.abs((AMBLAST[k]??-1)-v)>.001){AMB[k].gain.setTargetAtTime(v,now,playing?.3:.05);AMBLAST[k]=v}}
  BUS.gain.setTargetAtTime(1-LIP*.4,now,.08)}
function lipUpdate(){let v=0;if(analyser&&!audio.paused){analyser.getFloatTimeDomainData(abuf);let s=0;for(let k=0;k<abuf.length;k++)s+=abuf[k]*abuf[k];v=clamp((Math.sqrt(s/abuf.length)-.012)*10)}LIP+=(v-LIP)*(v>LIP?.55:.25)}

/* ================= ลูปหลัก ================= */
let seeking=false;
function loop(){const t=audio.currentTime||0;lipUpdate();render(t);try{sfxTick(t)}catch(err){console.warn(err)}
  if(!seeking&&audio.duration)$('seek').value=t/audio.duration;
  if(recording)$('status').textContent=`⏺ กำลังอัด... ${t.toFixed(1)} / ${dur.toFixed(1)} วินาที\nห้ามสลับแท็บหรือย่อหน้าต่าง`;
  requestAnimationFrame(loop)}
document.fonts&&document.fonts.load('600 58px Kanit').then(()=>{wrapCache={}});

/* ================= โหลดไฟล์เสียง ================= */
const KEY='lastday_ep1_sync_v1';
function loadFile(f){if(!f){$('status').textContent='ยังไม่ได้เลือกไฟล์';return}
  $('status').textContent='กำลังโหลด: '+f.name+' ...';if(audio.src)URL.revokeObjectURL(audio.src);audio.src=URL.createObjectURL(f);audio.load()}
$('file').addEventListener('change',e=>loadFile(e.target.files[0]));
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f)});
audio.addEventListener('error',()=>{$('status').textContent='❌ เบราว์เซอร์อ่านไฟล์เสียงนี้ไม่ได้\nลองแปลงเป็น MP3 แล้วเลือกใหม่ หรือใช้ Chrome บนคอมพิวเตอร์'});
audio.onloadedmetadata=()=>{dur=audio.duration;setTimes(autoTimes(dur));let msg='ใช้ซิงก์อัตโนมัติ (ประมาณการ)';
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Math.abs(s.dur-dur)<.5&&s.times.length===SEG.length){setTimes(s.times);msg='ใช้ซิงก์ที่บันทึกไว้ ✔'}}catch(_){}
  ['play','rec','syncBtn'].forEach(id=>$(id).disabled=false);$('status').textContent=`โหลดเสียงแล้ว (${dur.toFixed(1)} วินาที)\n${msg}`};
$('play').onclick=async()=>{ensureAudio();await actx.resume();if(audio.paused){await audio.play();$('play').textContent='⏸ หยุด'}else{audio.pause();$('play').textContent='▶ เล่นตัวอย่าง'}};
audio.onended=()=>{$('play').textContent='▶ เล่นตัวอย่าง';if(syncing)finishSync()};
$('seek').oninput=e=>{seeking=true;if(audio.duration)audio.currentTime=e.target.value*audio.duration};$('seek').onchange=()=>seeking=false;

/* ================= ซิงก์ด้วยมือ ================= */
function syncStatus(){const n=syncTimes.length;$('status').textContent=n<SEG.length?`🎯 ซิงก์ ${n}/${SEG.length-1}\nกด Space เมื่อเริ่มพูด:\n"${SEG[n][2]}"`:'ซิงก์ครบแล้ว'}
$('syncBtn').onclick=async()=>{ensureAudio();await actx.resume();syncing=true;syncTimes=[0];setTimes([0,...Array(SEG.length-1).fill(Infinity)]);audio.currentTime=0;await audio.play();syncStatus()};
function mark(){if(!syncing)return;syncTimes.push(audio.currentTime);setTimes(syncTimes.concat(Array(SEG.length-syncTimes.length).fill(Infinity)));syncStatus();if(syncTimes.length===SEG.length)finishSync()}
function finishSync(){if(!syncing)return;syncing=false;const n=syncTimes.length;
  if(n<SEG.length){const last=syncTimes[n-1],w=SEG.slice(n-1).map(s=>s[2].length+8),tot=w.reduce((a,b)=>a+b);let acc=w[0];
    for(let k=n;k<SEG.length;k++){syncTimes.push(last+acc/tot*(dur-last));acc+=w[k-n+1]}}
  setTimes(syncTimes.slice());localStorage.setItem(KEY,JSON.stringify({dur,times}));$('status').textContent='✔ บันทึกการซิงก์แล้ว พร้อมอัดวิดีโอ'}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&syncing){e.preventDefault();mark()}});
cv.addEventListener('pointerdown',mark);
$('resetSync').onclick=()=>{localStorage.removeItem(KEY);syncing=false;setTimes(autoTimes(dur));$('status').textContent='กลับเป็นซิงก์อัตโนมัติแล้ว'};

/* ================= อัดวิดีโอ ================= */
$('rec').onclick=async()=>{if(syncing)return;ensureAudio();await actx.resume();
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));if(!mime){alert('เบราว์เซอร์นี้ไม่รองรับการอัดวิดีโอ กรุณาใช้ Chrome/Edge');return}
  const stream=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6,audioBitsPerSecond:192000});const chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{recording=false;const ext=mime.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type:mime.split(';')[0]});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LAST_DAY_EP1_9x16.'+ext;a.click();
    ['play','rec','syncBtn'].forEach(id=>$(id).disabled=false);
    $('status').textContent=ext==='mp4'?'✔ ดาวน์โหลด MP4 แล้ว':'✔ ดาวน์โหลดแล้ว (WebM — เบราว์เซอร์นี้ไม่รองรับ MP4)'};
  ['play','rec','syncBtn'].forEach(id=>$(id).disabled=true);
  audio.pause();audio.currentTime=0;lastT=0;render(0);rec.start(500);recording=true;await audio.play();
  audio.addEventListener('ended',()=>setTimeout(()=>rec.stop(),1500),{once:true})};

setTimes(autoTimes(150));
requestAnimationFrame(loop);
</script>
